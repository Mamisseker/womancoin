<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Энергетический завод: корпус, батарея и разряд -->
  <defs>
    <linearGradient id="batBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="batAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#batBg)"/>
  <circle cx="64" cy="98" r="34" fill="#ffb800" opacity="0.1"/>

  <!-- корпус -->
  <path d="M18 100V62l12 9V62l12 9V54h58v46z" fill="#333336"/>
  <path d="M18 100V62l12 9V62l12 9V54h58v8H46v38z" fill="#3f3f43"/>

  <!-- труба с паром -->
  <rect x="26" y="26" width="13" height="32" rx="4" fill="#3a3a3c"/>
  <rect x="24" y="22" width="17" height="7" rx="3.5" fill="url(#batAccent)"/>

  <!-- батарея -->
  <rect x="56" y="30" width="40" height="26" rx="5" fill="#2a2a2c" stroke="url(#batAccent)" stroke-width="3"/>
  <rect x="96" y="38" width="5" height="10" rx="2.5" fill="url(#batAccent)"/>
  <rect x="61" y="35" width="11" height="16" rx="2.5" fill="url(#batAccent)"/>
  <rect x="75" y="35" width="16" height="16" rx="2.5" fill="#ffb800" opacity="0.4"/>

  <!-- молния -->
  <path d="M52 66l14 0-7 12h6l-15 16 4-13h-6z" fill="url(#batAccent)"/>

  <!-- окна -->
  <rect x="28" y="76" width="11" height="10" rx="2.5" fill="url(#batAccent)" opacity="0.85"/>
  <rect x="44" y="76" width="11" height="10" rx="2.5" fill="#ffb800" opacity="0.3"/>

  <!-- кабель к корпусу -->
  <path d="M56 70v14c0 3 3 4 3 7" stroke="#4a4a4e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- земля -->
  <rect x="12" y="102" width="104" height="5" rx="2.5" fill="#4a4a4e"/>
</svg>