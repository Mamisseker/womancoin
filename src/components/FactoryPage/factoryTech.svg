<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Техно-завод: корпус, стойки серверов и микросхема -->
  <defs>
    <linearGradient id="techBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="techAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#techBg)"/>
  <circle cx="64" cy="98" r="34" fill="#ffb800" opacity="0.1"/>

  <!-- корпус -->
  <path d="M18 100V60l12 9V60l12 9V52h58v48z" fill="#333336"/>
  <path d="M18 100V60l12 9V60l12 9V52h58v8H46v40z" fill="#3f3f43"/>

  <!-- стойка серверов -->
  <rect x="50" y="26" width="42" height="40" rx="4" fill="#2a2a2c" stroke="#4a4a4e" stroke-width="2"/>
  <rect x="54" y="31" width="34" height="8" rx="2" fill="url(#techAccent)" opacity="0.9"/>
  <rect x="54" y="43" width="34" height="8" rx="2" fill="#ffb800" opacity="0.45"/>
  <rect x="54" y="55" width="34" height="7" rx="2" fill="#ffb800" opacity="0.25"/>
  <circle cx="58" cy="35" r="2" fill="#04180c"/>
  <circle cx="58" cy="47" r="2" fill="#04180c"/>
  <circle cx="58" cy="58.5" r="2" fill="#04180c"/>

  <!-- микросхема -->
  <rect x="82" y="34" width="24" height="24" rx="4" fill="#2a2a2c" stroke="url(#techAccent)" stroke-width="2.5"/>
  <rect x="88" y="40" width="12" height="12" rx="2" fill="url(#techAccent)"/>
  <g stroke="#4a4a4e" stroke-width="2.5" stroke-linecap="round">
    <path d="M82 40h-6M82 46h-6M82 52h-6"/>
    <path d="M106 40h6M106 46h6M106 52h6"/>
    <path d="M90 34v-6M98 34v-6M90 58v6M98 58v6"/>
  </g>

  <!-- окна корпуса -->
  <rect x="26" y="76" width="11" height="10" rx="2.5" fill="url(#techAccent)" opacity="0.85"/>
  <rect x="42" y="76" width="11" height="10" rx="2.5" fill="#ffb800" opacity="0.3"/>

  <!-- антенна -->
  <path d="M34 52V38" stroke="#4a4a4e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="34" cy="34" r="4" fill="url(#techAccent)"/>

  <!-- земля -->
  <rect x="12" y="102" width="104" height="5" rx="2.5" fill="#4a4a4e"/>
</svg>