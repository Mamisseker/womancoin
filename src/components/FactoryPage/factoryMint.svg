<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Чеканильный цех: корпус, труба и отчеканённая монета -->
  <defs>
    <linearGradient id="mintBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="mintAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#mintBg)"/>

  <!-- свечение -->
  <circle cx="64" cy="96" r="34" fill="#ffb800" opacity="0.1"/>

  <!-- труба -->
  <rect x="26" y="30" width="14" height="30" rx="4" fill="#3a3a3c"/>
  <rect x="24" y="26" width="18" height="7" rx="3.5" fill="url(#mintAccent)"/>

  <!-- корпус цеха -->
  <path d="M20 96V62l10 8V62l10 8V56h58v40z" fill="#333336"/>
  <path d="M20 96V62l10 8V62l10 8V56h58v8H44v30z" fill="#3f3f43"/>

  <!-- окна цеха -->
  <rect x="50" y="68" width="12" height="10" rx="2.5" fill="url(#mintAccent)" opacity="0.9"/>
  <rect x="68" y="68" width="12" height="10" rx="2.5" fill="url(#mintAccent)" opacity="0.55"/>
  <rect x="86" y="68" width="10" height="10" rx="2.5" fill="#ffb800" opacity="0.3"/>

  <!-- отчеканённая монета -->
  <circle cx="96" cy="34" r="14" fill="url(#mintAccent)"/>
  <circle cx="96" cy="34" r="8.5" fill="none" stroke="#1a1200" stroke-width="2" opacity="0.65"/>
  <rect x="92" y="28" width="8" height="2.4" rx="1.2" fill="#1a1200" opacity="0.7"/>
  <rect x="92" y="33" width="8" height="2.4" rx="1.2" fill="#1a1200" opacity="0.7"/>
  <rect x="92" y="38" width="8" height="2.4" rx="1.2" fill="#1a1200" opacity="0.7"/>

  <!-- земля -->
  <rect x="14" y="98" width="100" height="5" rx="2.5" fill="#4a4a4e"/>
</svg>