<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Штамповочный цех: корпус, пресс и шестерня -->
  <defs>
    <linearGradient id="stampBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="stampAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#stampBg)"/>
  <circle cx="64" cy="96" r="34" fill="#ffb800" opacity="0.1"/>

  <!-- корпус цеха -->
  <rect x="22" y="58" width="84" height="42" rx="4" fill="#333336"/>
  <rect x="22" y="58" width="84" height="8" rx="4" fill="#4a4a4e"/>
  <rect x="22" y="44" width="20" height="14" rx="3" fill="#3a3a3c"/>

  <!-- пресс: рама и штамп -->
  <rect x="54" y="24" width="7" height="36" rx="3" fill="#4a4a4e"/>
  <rect x="46" y="20" width="23" height="8" rx="4" fill="url(#stampAccent)"/>
  <rect x="50" y="60" width="15" height="7" rx="2" fill="url(#stampAccent)"/>

  <!-- заготовка под штампом -->
  <rect x="44" y="72" width="26" height="6" rx="3" fill="#ffb800" opacity="0.5"/>

  <!-- окна -->
  <rect x="30" y="80" width="10" height="9" rx="2.5" fill="url(#stampAccent)" opacity="0.85"/>
  <rect x="86" y="80" width="12" height="9" rx="2.5" fill="#ffb800" opacity="0.3"/>

  <!-- шестерня -->
  <g fill="url(#stampAccent)" opacity="0.95">
    <circle cx="94" cy="36" r="13"/>
  </g>
  <g fill="#2a2118">
    <rect x="92.5" y="20" width="3" height="6" rx="1.5"/>
    <rect x="92.5" y="46" width="3" height="6" rx="1.5"/>
    <rect x="106.5" y="34.5" width="6" height="3" rx="1.5"/>
    <rect x="76.5" y="34.5" width="6" height="3" rx="1.5"/>
  </g>
  <circle cx="94" cy="36" r="5" fill="#2a2118"/>

  <!-- земля -->
  <rect x="14" y="102" width="100" height="5" rx="2.5" fill="#4a4a4e"/>
</svg>