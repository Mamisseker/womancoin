<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Химический завод: корпус, колбы и пузырьки -->
  <defs>
    <linearGradient id="chemBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="chemAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#chemBg)"/>
  <circle cx="64" cy="98" r="34" fill="#ffb800" opacity="0.1"/>

  <!-- корпус -->
  <rect x="20" y="62" width="88" height="40" rx="4" fill="#333336"/>
  <rect x="20" y="62" width="88" height="8" rx="4" fill="#4a4a4e"/>

  <!-- вытяжная труба -->
  <rect x="28" y="34" width="12" height="28" rx="4" fill="#3a3a3c"/>
  <rect x="26" y="30" width="16" height="6" rx="3" fill="url(#chemAccent)"/>

  <!-- резервуары на крыше -->
  <rect x="52" y="44" width="16" height="18" rx="5" fill="#2a2a2c" stroke="#4a4a4e" stroke-width="2"/>
  <rect x="54" y="54" width="12" height="6" rx="2" fill="url(#chemAccent)" opacity="0.85"/>
  <rect x="74" y="40" width="14" height="22" rx="5" fill="#2a2a2c" stroke="#4a4a4e" stroke-width="2"/>
  <rect x="76" y="52" width="10" height="8" rx="2" fill="url(#chemAccent)" opacity="0.5"/>

  <!-- трубки между резервуарами -->
  <path d="M68 56h6" stroke="#4a4a4e" stroke-width="3" stroke-linecap="round"/>

  <!-- колба -->
  <path d="M52 76h14v10l9 20H43l9-20z" fill="#2a2a2c" stroke="url(#chemAccent)" stroke-width="2.5"
        stroke-linejoin="round"/>
  <path d="M48 92h22l5 12H43z" fill="url(#chemAccent)"/>

  <!-- пузырьки -->
  <circle cx="56" cy="90" r="3" fill="#1c1c1e" opacity="0.35"/>
  <circle cx="64" cy="96" r="2" fill="#1c1c1e" opacity="0.35"/>
  <circle cx="52" cy="97" r="1.8" fill="#1c1c1e" opacity="0.3"/>
  <circle cx="94" cy="34" r="3.5" fill="#ffb800" opacity="0.3"/>
  <circle cx="104" cy="46" r="2.5" fill="#ffb800" opacity="0.22"/>

  <!-- окна корпуса -->
  <rect x="26" y="76" width="10" height="10" rx="2.5" fill="url(#chemAccent)" opacity="0.85"/>
  <rect x="84" y="76" width="14" height="10" rx="2.5" fill="#ffb800" opacity="0.3"/>

  <!-- земля -->
  <rect x="12" y="102" width="104" height="5" rx="2.5" fill="#4a4a4e"/>
</svg>